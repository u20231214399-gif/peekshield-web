<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PeekShield — Asistencia</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
  <script src="js/firebase.js"></script>
</head>
<body>

<header>
  <h1>🛡️ PeekShield</h1>
</header>

<nav>
  <button class="active" onclick="showPage('registrar', this)">👤 Registrar</button>
  <button onclick="showPage('asistencia', this)">📸 Asistencia</button>
  <button onclick="showPage('historial', this)">📋 Historial</button>
</nav>

<!-- REGISTRAR -->
<div id="page-registrar" class="page active">
  <h2>Registrar Estudiante</h2>
  <video id="videoRegistro" autoplay playsinline muted></video>
  <canvas id="canvasRegistro" data-vacio="true"></canvas>
  <button class="btn secondary" onclick="capturarFotoRegistro()">📸 Capturar foto</button>
  <input type="text" id="inputNombre" placeholder="Nombre completo del estudiante"/>
  <button class="btn" onclick="registrarEstudiante()">✅ Registrar</button>
  <div class="status" id="statusRegistrar"></div>
</div>

<!-- ASISTENCIA -->
<div id="page-asistencia" class="page">
  <h2>Tomar Asistencia</h2>
  <div id="videoContainer">
    <video id="video" autoplay playsinline muted></video>
    <div id="faceOverlay"></div>
  </div>
  <div class="status" id="statusAsistencia">👤 Acércate a la cámara...</div>
  <div style="margin-top:16px; display:none" id="btnSiguienteWrap">
    <button class="btn" onclick="siguienteEstudiante()">Siguiente estudiante</button>
  </div>
</div>

<!-- HISTORIAL -->
<div id="page-historial" class="page">
  <h2>Historial de Asistencia</h2>
  <div class="filtros">
    <input type="date" id="filtroFecha"/>
    <button class="btnSmall" onclick="cargarHistorial()">Filtrar</button>
    <button class="btnSmall green" onclick="exportarExcel()">⬇️ Excel</button>
  </div>
  <div id="listaHistorial"></div>
</div>

<!-- Modal foto -->
<div id="modalFoto" onclick="this.classList.remove('visible')">
  <img id="modalImg" src=""/>
</div>

<script src="js/app.js"></script>
<script src="js/registrar.js"></script>
<script src="js/asistencia.js"></script>
<script src="js/historial.js"></script>

<script>
  // Iniciar cámara de registro al cargar
  document.addEventListener('DOMContentLoaded', () => {
    iniciarCamaraRegistro();
  });
</script>
</body>
</html>
